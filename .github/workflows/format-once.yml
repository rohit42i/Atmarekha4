name: One-time refactor formatting repair
on:
  push:
    branches:
      - refactor/production-architecture
    paths:
      - .github/workflows/format-once.yml
permissions:
  contents: write
concurrency:
  group: one-time-format-repair
  cancel-in-progress: false
jobs:
  format-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v6
        with:
          ref: refactor/production-architecture
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply repository Prettier configuration
        run: npm run format
      - name: Run quality checks
        run: npm run quality:check
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run production regression checks
        run: npm run check
      - name: Build production bundle
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://pbukwjokgkqacaphlqzm.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_g0VUtYwOVwHcfRoY3zD9FA_seUEV61E
      - name: Remove one-time workflow and commit formatter repairs
        run: |
          git rm .github/workflows/format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "style: apply Prettier to refactor quality-gate files"
            git push origin HEAD:refactor/production-architecture
          fi
