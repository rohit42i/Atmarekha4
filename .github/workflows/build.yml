name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify no legacy backend source remains
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'localhost:5000|VITE_API_BASE_URL|from .axios.|require\(.axios.\)|from .express.|from .mongoose.|from .mongodb.|cloudinary' \
            --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist .; then
            echo "Legacy backend reference detected. Remove it before merging."
            exit 1
          fi

      - name: Build production bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'placeholder-key' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-key' }}
        run: npm run build

      - name: Verify build output
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -s dist/index.html
