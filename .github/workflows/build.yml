name: Build Atma Rekha

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install pinned social image optimizer in a temporary directory
        run: npm install --prefix "$RUNNER_TEMP/social-image-optimizer" --no-save sharp@0.35.5

      - name: Generate optimized social preview image
        run: node scripts/optimize-social-image.mjs
        env:
          SHARP_MODULE_PATH: ${{ runner.temp }}/social-image-optimizer/node_modules/sharp

      - name: Validate analytics Worker syntax
        run: node --check analytics-worker/worker.js

      - name: Test analytics Worker view ingestion and counts
        run: node scripts/test-analytics-worker.mjs

      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Full dependency audit report
        continue-on-error: true
        run: |
          npm audit --audit-level=high || echo '::warning::Development dependency advisories remain under review; production dependencies are gated separately.'

      - name: Static production regression checks
        run: npm run check

      - name: Worker syntax and SEO regression tests
        run: |
          node --check worker.js
          node --check atma-media-worker/index.js
          node --check scripts/smoke-test-live-site.mjs
          node scripts/test-worker-seo.mjs

      - name: Build production bundle
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://pbukwjokgkqacaphlqzm.supabase.co
          # Supabase publishable key is safe for public frontend use.
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_g0VUtYwOVwHcfRoY3zD9FA_seUEV61E
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Ensure optimized social preview is included in deployment assets
        run: |
          test -s public/og-atmarekha.jpg
          install -m 0644 public/og-atmarekha.jpg dist/og-atmarekha.jpg
          test -s dist/og-atmarekha.jpg
          bytes="$(wc -c < dist/og-atmarekha.jpg)"
          if [ "$bytes" -gt 614400 ]; then
            echo "::error::Optimized social preview exceeds the 600 KiB deployment limit."
            exit 1
          fi
          echo "Verified deployed social preview: ${bytes} bytes."

      - name: Deploy website to Cloudflare
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Ensure PDPL R2 bucket exists
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: pdlpl-media-worker
        run: |
          buckets="$(npx wrangler r2 bucket list)"
          if ! printf '%s' "$buckets" | grep -q 'pdlpl-manga'; then
            npx wrangler r2 bucket create pdlpl-manga
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configure PDPL Worker Supabase publishable key
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: pdlpl-media-worker
        run: printf '%s' "$SUPABASE_PUBLISHABLE_KEY" | npx wrangler secret put SUPABASE_PUBLISHABLE_KEY
        env:
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_g0VUtYwOVwHcfRoY3zD9FA_seUEV61E
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy PDPL media Worker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: pdlpl-media-worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Atma Rekha analytics Worker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx --yes wrangler@latest deploy --config analytics-worker/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify live chapter view endpoint
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          node --input-type=module <<'NODE'
          const chapterId = '00000000-0000-4000-8000-000000000000';
          const url = 'https://atma-rekha-analytics.rohitbaswaraj.workers.dev/v1/views?chapterIds=' + chapterId;
          let lastError;
          for (let attempt = 1; attempt <= 8; attempt++) {
            try {
              const response = await fetch(url, { headers: { Accept: 'application/json', Origin: 'https://www.atmarekha.in' } });
              if (response.ok) {
                const payload = await response.json();
                if (typeof payload?.[chapterId] === 'number') {
                  console.log('Chapter view endpoint is live and returns numeric counts.');
                  process.exit(0);
                }
                lastError = new Error('Endpoint returned an unexpected payload.');
              } else {
                lastError = new Error('Endpoint returned HTTP ' + response.status + ': ' + (await response.text()).slice(0, 300));
              }
            } catch (error) {
              lastError = error;
            }
            await new Promise(resolve => setTimeout(resolve, 2000));
          }
          throw new Error('Chapter view endpoint smoke test failed: ' + (lastError?.message || 'unknown error'));
          NODE

      - name: Verify Cloudflare zone transport security
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [[ -z "$CLOUDFLARE_ZONE_SETTINGS_TOKEN" ]]; then
            echo "::warning::CLOUDFLARE_ZONE_SETTINGS_TOKEN is not configured. The live smoke test will still verify HTTPS redirects and response headers, but automatic zone-setting enforcement requires a token with Zone Settings Read/Edit."
          else
            curl --fail-with-body --silent --show-error \
              -X PATCH "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/settings" \
              -H "Authorization: Bearer $CLOUDFLARE_ZONE_SETTINGS_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"items":[{"id":"always_use_https","value":"on"},{"id":"min_tls_version","value":"1.2"},{"id":"automatic_https_rewrites","value":"on"}]}'
            settings="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $CLOUDFLARE_ZONE_SETTINGS_TOKEN" \
              "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/settings")"
            printf '%s' "$settings" | node --input-type=module -e '
              let input = "";
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                const response = JSON.parse(input);
                if (!response.success || !Array.isArray(response.result)) {
                  console.error("Cloudflare settings verification request failed.");
                  process.exit(1);
                }
                const values = Object.fromEntries(response.result.map(item => [item.id, item.value]));
                if (values.always_use_https !== "on" ||
                    values.min_tls_version !== "1.2" ||
                    values.automatic_https_rewrites !== "on") {
                  console.error("Cloudflare HTTPS/TLS settings did not match the required values.");
                  process.exit(1);
                }
                console.log("Cloudflare HTTPS redirect and minimum TLS 1.2 settings verified.");
              });
            '
            curl --fail-with-body --silent --show-error \
              -X PATCH "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/settings/security_header" \
              -H "Authorization: Bearer $CLOUDFLARE_ZONE_SETTINGS_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"value":{"strict_transport_security":{"enabled":false,"max_age":0,"include_subdomains":false,"preload":false,"nosniff":false}}}'
            security_header="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $CLOUDFLARE_ZONE_SETTINGS_TOKEN" \
              "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/settings/security_header")"
            printf '%s' "$security_header" | node --input-type=module -e '
              let input = "";
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                const response = JSON.parse(input);
                if (!response.success || response.result?.value?.strict_transport_security?.enabled !== false) {
                  console.error("Cloudflare zone-level HSTS must stay disabled; the Worker owns the HSTS header.");
                  process.exit(1);
                }
                console.log("Cloudflare zone-level HSTS is disabled; Worker HSTS header remains authoritative.");
              });
            '
          fi
        env:
          CLOUDFLARE_ZONE_SETTINGS_TOKEN: ${{ secrets.CLOUDFLARE_ZONE_SETTINGS_TOKEN }}
          CF_ZONE_ID: 8dbd4ce15e5916a6c1d95dbb5f1581d0

      - name: Verify live site routes, assets, and security headers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/smoke-test-live-site.mjs

  deploy-atma-media-worker:
    name: Deploy Atma media Worker (independent hotfix path)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Deploy Atma media Worker
        run: npx wrangler deploy --config atma-media-worker/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
