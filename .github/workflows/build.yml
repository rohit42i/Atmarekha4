name: Build Atma Rekha

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Build production bundle
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://pbukwjokgkqacaphlqzm.supabase.co
          # Supabase publishable key is safe for public frontend use.
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_g0VUtYwOVwHcfRoY3zD9FA_seUEV61E
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}



      - name: Deploy website to Cloudflare
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Ensure PDPL R2 bucket exists
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: pdlpl-media-worker
        run: |
          buckets="$(npx wrangler r2 bucket list)"
          if ! printf '%s' "$buckets" | grep -q 'pdlpl-manga'; then
            npx wrangler r2 bucket create pdlpl-manga
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configure PDPL Worker Supabase secret
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: pdlpl-media-worker
        run: printf '%s' "$SUPABASE_ANON_KEY" | npx wrangler secret put SUPABASE_ANON_KEY
        env:
          SUPABASE_ANON_KEY: sb_publishable_g0VUtYwOVwHcfRoY3zD9FA_seUEV61E
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy PDPL media Worker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: pdlpl-media-worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}