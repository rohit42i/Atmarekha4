name: Remove notification bell
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/remove-bell.yml'

jobs:
  remove:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove bell component and header usage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('App.jsx')
          s = p.read_text()
          start = s.find('function NotificationBell(')
          if start >= 0:
              end = s.find('\nfunction ', start + 10)
              if end < 0:
                  end = s.find('\nconst ', start + 10)
              if end >= 0:
                  s = s[:start] + s[end+1:]
          import re
          s = re.sub(r'<NotificationBell\s+apiBaseUrl=\{apiBaseUrl\}\s*/>','',s)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add App.jsx
          git diff --cached --quiet || git commit -m 'fix: remove notification bell'
          git push
      - name: Remove workflow
        if: success()
        run: |
          git rm .github/workflows/remove-bell.yml
          git commit -m 'chore: remove temporary bell workflow'
          git push