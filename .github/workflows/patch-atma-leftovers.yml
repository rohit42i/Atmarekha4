name: Patch Atma Rekha leftovers

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'fix: null chapter labels, reader error states, reading history events, access guard'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch App.jsx
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('App.jsx')
          s = p.read_text()
          original = s

          s = s.replace(
              "import { buildChapters, buildChapterPages } from './chapters';",
              "import { buildChapters, buildChapterPages, formatChapterLabel, formatChapterEyebrow } from './chapters';"
          )

          s = s.replace(
              'CHAPTER {chapter.chapterNumber}',
              '{formatChapterEyebrow(chapter.chapterNumber, chapter.title)}'
          )
          s = s.replace(
              '<span>Chapter {chapter.chapterNumber}</span>',
              '<span>{formatChapterLabel(chapter.chapterNumber, { title: chapter.title })}</span>'
          )
          s = s.replace(
              'label={`Rate Chapter ${chapter.chapterNumber}`}',
              'label={`Rate ${formatChapterLabel(chapter.chapterNumber, { title: chapter.title })}`}'
          )
          s = s.replace(
              'label={`Comments for Chapter ${chapter.chapterNumber}`}',
              'label={`Comments for ${formatChapterLabel(chapter.chapterNumber, { title: chapter.title })}`}'
          )

          old_nav = "const previousChapter = chapters.filter(published).filter(item => Number(item.chapterNumber) < Number(chapter.chapterNumber)).at(-1); const nextChapter = chapters.filter(published).find(item => Number(item.chapterNumber) > Number(chapter.chapterNumber));"
          new_nav = "const finite = (n) => { if (n === null || n === undefined || n === '') return null; const v = Number(n); return Number.isFinite(v) ? v : null; }; const currentNum = finite(chapter.chapterNumber); const publishedList = chapters.filter(published); let previousChapter = null; let nextChapter = null; if (currentNum !== null) { previousChapter = [...publishedList].reverse().find((item) => { const n = finite(item.chapterNumber); return n !== null && n < currentNum; }); nextChapter = publishedList.find((item) => { const n = finite(item.chapterNumber); return n !== null && n > currentNum; }); }"
          if old_nav not in s:
              raise SystemExit('Expected previous/next chapter logic was not found; refusing to modify App.jsx')
          s = s.replace(old_nav, new_nav, 1)

          old_return = "if (error || !chapter || !pages.length) return <main className=\"reader-page\"><div className=\"reader-error\"><div>⌁</div><h2>{error || 'This chapter has no readable pages yet.'}</h2><button className=\"primary-button\" onClick={onBack}>Back to chapters</button></div></main>;"
          new_return = "if (error) return <main className=\"reader-page\"><div className=\"reader-error\"><div>⌁</div><h2>{error}</h2><button className=\"primary-button\" onClick={onBack}>Back to chapters</button></div></main>; if (!chapter) return <main className=\"reader-page\"><div className=\"reader-error\"><div>⌁</div><h2>Chapter not found.</h2><button className=\"primary-button\" onClick={onBack}>Back to chapters</button></div></main>; if (!pages.length) return <main className=\"reader-page\"><div className=\"reader-error\"><div>⌁</div><h2>This chapter has no readable pages yet.</h2><button className=\"primary-button\" onClick={onBack}>Back to chapters</button></div></main>;"
          if old_return not in s:
              raise SystemExit('Expected reader error return was not found; refusing to modify App.jsx')
          s = s.replace(old_return, new_return, 1)

          marker = "useEffect(() => { if (chapter && pages.length) window.localStorage.setItem(`atma-reading:${chapter.id}`, String(index)); }, [chapter, pages.length, index]);"
          progress = marker + "\n  useEffect(() => { if (chapter && pages.length > 0) { window.dispatchEvent(new CustomEvent('atma-reading-progress', { detail: { chapterId: chapter.id, pageNumber: index + 1 } })); } }, [chapter, index, pages.length]);"
          if marker not in s:
              raise SystemExit('Expected reader localStorage effect was not found; refusing to modify App.jsx')
          s = s.replace(marker, progress, 1)

          # Replace common reader/nav page labels without touching routing or handlers.
          s = re.sub(r'>(?:Chapter) \$\{([^}]*chapterNumber)\}<', r'>{formatChapterLabel(\1, { title: chapter.title })}<', s)
          s = re.sub(r'`Chapter \$\{chapter\.chapterNumber\}`', r'formatChapterLabel(chapter.chapterNumber, { title: chapter.title })', s)

          # Image alt text: preserve any page suffix while replacing the unsafe chapter label.
          s = s.replace(
              'Chapter ${chapter.chapterNumber}',
              '${formatChapterLabel(chapter.chapterNumber, { title: chapter.title })}'
          )

          if s == original:
              raise SystemExit('No App.jsx changes were produced; refusing to commit')
          p.write_text(s)
          PY

          grep -q "formatChapterLabel, formatChapterEyebrow" App.jsx
          grep -q "atma-reading-progress" App.jsx
          grep -q "const finite =" App.jsx
          grep -q "This chapter has no readable pages yet." App.jsx
      - name: Build
        run: npm install && npm run build
      - name: Commit patched App.jsx and remove this workflow
        run: |
          rm -f .github/workflows/patch-atma-leftovers.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.jsx .github/workflows/patch-atma-leftovers.yml
          git commit -m "fix: patch App reader and chapter labels"
          git push origin HEAD:main
