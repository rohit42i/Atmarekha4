name: Admin UI Build Verification

on:
  push:
    branches:
      - "admin/**"
    paths:
      - "AdminPanel.jsx"
      - "admin-homeguard-theme.css"
      - "admin-*.css"
      - "admin-*.jsx"
      - "AdminOverview.jsx"
      - "AdminChapterManager.jsx"
      - "AdminChapterPages.jsx"
      - "AdminMembership.jsx"
      - "AdminModerationQueue.jsx"
      - "EmailStudio.jsx"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - ".github/workflows/admin-ui-build.yml"
  pull_request:
    paths:
      - "AdminPanel.jsx"
      - "admin-homeguard-theme.css"
      - "admin-*.css"
      - "admin-*.jsx"
      - "AdminOverview.jsx"
      - "AdminChapterManager.jsx"
      - "AdminChapterPages.jsx"
      - "AdminMembership.jsx"
      - "AdminModerationQueue.jsx"
      - "EmailStudio.jsx"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - ".github/workflows/admin-ui-build.yml"

permissions:
  contents: read

concurrency:
  group: admin-ui-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build production bundle
        run: npm run build
