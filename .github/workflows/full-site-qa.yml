name: Full Website QA

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test qa/full-site-audit.spec.js
        env:
          BASE_URL: https://www.atmarekha.in
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atma-rekha-qa-report
          path: |
            qa-report
            test-results
          retention-days: 14
