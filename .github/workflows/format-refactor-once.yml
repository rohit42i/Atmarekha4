name: One-time refactor formatting repair

on:
  push:
    branches:
      - refactor/production-architecture

permissions:
  contents: write

jobs:
  format-and-commit:
    if: github.event.head_commit.message != 'chore: format production refactor files'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/production-architecture
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format only the configured quality-gate files
        run: npm run format
      - name: Remove this temporary workflow and commit formatting-only changes
        run: |
          rm .github/workflows/format-refactor-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "chore: format production refactor files"
            git push origin HEAD:refactor/production-architecture
          fi
