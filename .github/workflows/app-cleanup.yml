name: Atma Rekha App cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore: apply App.jsx cleanup') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply targeted App.jsx cleanup
        env:
          COVER_URL: https://pbukwjokgkqacaphlqzm.supabase.co/storage/v1/object/public/chapter-pages/covers/76122fec-9c6e-4fb5-8aac-b9853203da60.jpg
        run: |
          python3 <<'PY'
          from pathlib import Path
          import os, re

          p = Path('App.jsx')
          s = p.read_text(encoding='utf-8')
          original = s

          # 1) Remove the huge embedded PNG while retaining a real existing Supabase image.
          s, n = re.subn(
              r"coverImage:\s*'data:image/png;base64,[^']*'",
              "coverImage: " + repr(os.environ['COVER_URL']),
              s,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('Expected exactly one embedded coverImage was not found.')

          # 2) Remove the obsolete hardcoded chapter catalogue. Public chapters will come from Supabase.
          s, n = re.subn(
              r"\nconst CHAPTERS = \[.*?\n\}\)\);\n",
              "\n",
              s,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('Hardcoded CHAPTERS catalogue was not found in the expected form.')

          # 3) Import the existing public Supabase client.
          if "from './supabase.js'" not in s:
              s = s.replace("import { gsap } from 'gsap';", "import { gsap } from 'gsap';\nimport { supabase } from './supabase.js';", 1)

          # 4) Use Supabase chapters/pages in ReadingPage instead of the removed catalogue.
          s, n = re.subn(
              r"function ReadingPage\(\{ storyId, onOpenComments, onBack, onSortToggle, isReversed \}\)",
              "function ReadingPage({ storyId, chapters = [], chaptersLoading = false, chaptersError = '', onOpenComments, onBack, onSortToggle, isReversed })",
              s,
              count=1,
          )
          if n != 1:
              raise SystemExit('ReadingPage signature was not found.')

          s, n = re.subn(
              r"\n  const chapters = useMemo\(\n    \(\) => \(isReversed \? \[\.\.\.CHAPTERS\]\.reverse\(\) : \[\.\.\.CHAPTERS\]\),\n    \[isReversed\]\n  \);",
              "\n  const orderedChapters = useMemo(() => (isReversed ? [...chapters].reverse() : chapters), [chapters, isReversed]);",
              s,
              count=1,
          )
          if n != 1:
              raise SystemExit('ReadingPage chapter memo was not found.')

          # Replace chapter-list references only inside ReadingPage block.
          start = s.index('function ReadingPage(')
          end = s.index('// --- src/components/sections/ChapterReader.jsx ---', start)
          block = s[start:end]
          block = block.replace('chapters.length', 'orderedChapters.length')
          block = block.replace('chapters[chapters.length - 1]', 'orderedChapters[orderedChapters.length - 1]')
          block = block.replace('chapters.map(', 'orderedChapters.map(')
          block = block.replace('{chapters.length} Chapters', '{orderedChapters.length} Chapters')

          marker = '<div className="flex flex-col gap-4">'
          empty = '''<div className="flex flex-col gap-4">\n          {chaptersLoading ? (\n            <div className="rounded-2xl border border-zinc-200 bg-white p-8 text-center text-zinc-500 dark:border-zinc-800 dark:bg-zinc-900">Loading chapters...</div>\n          ) : chaptersError ? (\n            <div className="rounded-2xl border border-red-200 bg-red-50 p-8 text-center text-red-700 dark:border-red-900/50 dark:bg-red-950/30 dark:text-red-300">{chaptersError}</div>\n          ) : orderedChapters.length === 0 ? (\n            <div className="rounded-2xl border-2 border-dashed border-zinc-200 bg-white p-8 text-center text-zinc-500 dark:border-zinc-800 dark:bg-zinc-900">No published chapters yet.</div>\n          ) : (\n            orderedChapters.map('''
          if marker not in block:
              raise SystemExit('ReadingPage chapter list marker was not found.')
          block = block.replace(marker, empty, 1)
          # Close the conditional around the existing map body.
          map_close = '\n          ))}\n'
          if map_close not in block:
              raise SystemExit('ReadingPage chapter map closing marker was not found.')
          block = block.replace(map_close, '\n          ))\n          )}\n', 1)
          # Fix any remaining chapter variable in the list block.
          block = block.replace('{chapters.map(', '{orderedChapters.map(')
          s = s[:start] + block + s[end:]

          # 5) Make ChapterReader consume the current Supabase chapter list.
          s, n = re.subn(
              r"function ChapterReader\(\{ chapterId, onBack \}\)",
              "function ChapterReader({ chapterId, chapters = [], onBack })",
              s,
              count=1,
          )
          if n != 1:
              raise SystemExit('ChapterReader signature was not found.')
          s, n = re.subn(
              r"const chapter = useMemo\(\(\) => CHAPTERS\.find\(\(item\) => item\.id === chapterId\), \[chapterId\]\);",
              "const chapter = useMemo(() => chapters.find((item) => item.id === chapterId), [chapters, chapterId]);",
              s,
              count=1,
          )
          if n != 1:
              raise SystemExit('ChapterReader hardcoded lookup was not found.')

          # 6) Load chapters and their pages from the current Supabase schema in App.
          app_start = s.index('function App()')
          state_anchor = "  const [activeChapterId, setActiveChapterId] = useState(null);"
          pos = s.index(state_anchor, app_start) + len(state_anchor)
          state_code = '''\n  const [chapters, setChapters] = useState([]);\n  const [chaptersLoading, setChaptersLoading] = useState(true);\n  const [chaptersError, setChaptersError] = useState('');\n\n  useEffect(() => {\n    let cancelled = false;\n\n    const loadChapters = async () => {\n      setChaptersLoading(true);\n      setChaptersError('');\n\n      const [chaptersResult, pagesResult] = await Promise.all([\n        supabase\n          .from('chapters')\n          .select('id, "Chapter Number", "Title", "Description", "Cover url", status, "Release date", "Created at"')\n          .order('Chapter Number', { ascending: true }),\n        supabase\n          .from('chapter_pages')\n          .select('"Chapter id", "Page number", "Image url"')\n          .order('Page number', { ascending: true }),\n      ]);\n\n      if (cancelled) return;\n\n      if (chaptersResult.error) {\n        setChapters([]);\n        setChaptersError(`Could not load chapters: ${chaptersResult.error.message}`);\n        setChaptersLoading(false);\n        return;\n      }\n\n      if (pagesResult.error) {\n        setChapters([]);\n        setChaptersError(`Could not load chapter pages: ${pagesResult.error.message}`);\n        setChaptersLoading(false);\n        return;\n      }\n\n      const pagesByChapter = new Map();\n      for (const page of pagesResult.data || []) {\n        const id = page['Chapter id'];\n        if (!id || !page['Image url']) continue;\n        const list = pagesByChapter.get(id) || [];\n        list.push(page);\n        pagesByChapter.set(id, list);\n      }\n\n      const normalized = (chaptersResult.data || [])\n        .filter((chapter) => !chapter.status || String(chapter.status).toLowerCase() === 'published')\n        .map((chapter) => ({\n          id: chapter.id,\n          chapterNumber: Number(chapter['Chapter Number']),\n          title: chapter.Title,\n          description: chapter.Description || '',\n          coverImage: chapter['Cover url'] || '',\n          status: chapter.status || 'Published',\n          releaseDate: chapter['Release date'] || chapter['Created at'] || null,\n          pages: (pagesByChapter.get(chapter.id) || [])\n            .sort((a, b) => Number(a['Page number']) - Number(b['Page number']))\n            .map((page) => page['Image url']),\n          pdfUrl: null,\n        }));\n\n      setChapters(normalized);\n      setChaptersLoading(false);\n    };\n\n    loadChapters();\n    return () => { cancelled = true; };\n  }, []);\n'''
          if 'const [chapters, setChapters]' not in s[app_start:app_start+2500]:
              s = s[:pos] + state_code + s[pos:]

          # Remove the old App-level hardcoded memo if present.
          s, n = re.subn(
              r"\n  const chapters = useMemo\(\(\) => \(isReversed \? \[\.\.\.CHAPTERS\]\.reverse\(\) : \[\.\.\.CHAPTERS\]\), \[isReversed\]\);",
              "",
              s,
              count=1,
          )

          # 7) Pass live chapter data to both reading views.
          s = s.replace('''<ReadingPage\n          storyId={activeStoryId}\n          dummyChapters={chapters}''', '''<ReadingPage\n          storyId={activeStoryId}\n          chapters={chapters}\n          chaptersLoading={chaptersLoading}\n          chaptersError={chaptersError}''', 1)
          s = s.replace('''<ChapterReader chapterId={activeChapterId} onBack={() => window.history.back()} />''', '''<ChapterReader chapterId={activeChapterId} chapters={chapters} onBack={() => window.history.back()} />''', 1)

          # 8) Remove the obsolete MongoDB/Express announcement copy.
          s, _ = re.subn(
              r"\n\s*\{\s*id: 'supabase-ready',.*?\n\s*\},",
              '',
              s,
              count=1,
              flags=re.S,
          )

          # 9) Remove the personal phone number without deleting the whole contact section.
          s, n = re.subn(
              r'<a href="tel:\+917204137931"[^>]*>\s*\+91 72041 37931\s*</a>',
              '<span className="font-medium">Use the contact form below</span>',
              s,
              count=1,
          )
          if n != 1:
              raise SystemExit('Expected phone number link was not found.')

          if s == original:
              raise SystemExit('No changes were made.')
          p.write_text(s, encoding='utf-8')
          print('Targeted App.jsx cleanup applied.')
          PY

      - name: Verify forbidden legacy strings are gone from App.jsx
        run: |
          ! grep -nE '7204137931|\+91 72041 37931|data:image/png;base64|const CHAPTERS|CHAPTERS\.find' App.jsx

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.jsx
          git diff --cached --check
          git commit -m "chore: apply App.jsx cleanup and Supabase chapter flow"
          git push

      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/app-cleanup.yml
          git commit -m "chore: remove temporary App cleanup workflow"
          git push
