name: Historical Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan repository history for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan changes with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: true

      - name: Install checksum-verified Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl --fail --location --silent --show-error "${base}/${archive}" -o "${archive}"
          curl --fail --location --silent --show-error "${base}/gitleaks_${version}_checksums.txt" -o checksums.txt
          grep "  ${archive}$" checksums.txt | sha256sum --check -
          tar -xzf "${archive}" gitleaks
          ./gitleaks version

      - name: Scan complete history reachable from main
        run: ./gitleaks git --redact --verbose --log-opts="origin/main" .
