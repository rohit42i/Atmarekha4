name: One-time dependency security verification

on:
  push:
    branches:
      - refactor/production-architecture

permissions:
  contents: write

jobs:
  update-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Regenerate lockfile with scoped patched parser override
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Clean install
        run: npm ci
      - name: Format scoped TypeScript configuration
        run: npx --yes prettier@3.9.10 --write jsconfig.json
      - name: Run quality gate
        run: npm run quality:check
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Check patched transitive parser and report remaining dev advisories
        shell: bash
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('/tmp/npm-audit.json', 'utf8'));
          const vulnerabilities = report.vulnerabilities || {};
          if (vulnerabilities['postcss-selector-parser']) {
            console.error('Patched parser advisory is still present.');
            process.exit(1);
          }
          console.log('postcss-selector-parser advisory cleared.');
          if (vulnerabilities.braces) {
            console.warn('Known development-only braces advisory remains; no compatible patched release is available in the Tailwind 3 dependency tree.');
          }
          console.log('Full dependency audit summary:', JSON.stringify(report.metadata?.vulnerabilities || {}));
          NODE
      - name: Run static production checks
        run: npm run check
      - name: Build production bundle
        run: npm run build
      - name: Commit updated lockfile and remove this temporary workflow
        run: |
          rm .github/workflows/dependency-security-verify-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json jsconfig.json .github/workflows/dependency-security-verify-once.yml
          git commit -m "security: lock patched PostCSS parser and verify dependencies"
          git push origin HEAD
