name: One-time safe dependency override
on:
  push:
    branches:
      - refactor/production-architecture
    paths:
      - .github/workflows/audit-once.yml
permissions:
  contents: write
jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/production-architecture
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Pin patched source-map-js without a major framework change
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.overrides = { ...(pkg.overrides || {}), 'source-map-js': '1.2.2' };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts
      - name: Install the resulting lockfile
        run: npm ci
      - name: Report remaining development-only advisories
        run: |
          npm audit --json > audit.json || true
          node <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          const packages = Object.entries(audit.vulnerabilities || {}).map(([name, v]) => ({ name, severity: v.severity, isDirect: v.isDirect, fixAvailable: v.fixAvailable, effects: v.effects }));
          console.log(JSON.stringify({ totals: audit.metadata?.vulnerabilities, packages }, null, 2));
          NODE
      - name: Format and run quality gate
        run: |
          npm run format
          npm run quality:check
          npm audit --omit=dev --audit-level=high
          npm run check
          npm run build
        env:
          VITE_SUPABASE_URL: https://pbukwjokgkqacaphlqzm.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_g0VUtYwOVwHcfRoY3zD9FA_seUEV61E
      - name: Remove one-time workflow and commit safe override
        run: |
          git rm .github/workflows/audit-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): use patched source-map-js in development tree"
            git push origin HEAD:refactor/production-architecture
          fi
