name: One-time full dependency audit detail
on:
  push:
    branches:
      - refactor/production-architecture
    paths:
      - .github/workflows/audit-once.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/production-architecture
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Print full audit findings without exposing lockfile contents
        run: |
          npm audit --json > audit.json || true
          node <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          const packages = Object.entries(audit.vulnerabilities || {}).map(([name, v]) => ({
            name, severity: v.severity, range: v.range, isDirect: v.isDirect,
            fixAvailable: v.fixAvailable, effects: v.effects,
            advisories: (v.via || []).map(a => typeof a === 'string' ? a : ({
              name: a.name, title: a.title, url: a.url, range: a.range,
            })),
          }));
          console.log(JSON.stringify({ totals: audit.metadata?.vulnerabilities, packages }, null, 2));
          NODE
