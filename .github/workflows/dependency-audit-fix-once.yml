name: One-time dependency security remediation

on:
  push:
    branches:
      - refactor/production-architecture

permissions:
  contents: write

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install current lockfile
        run: npm ci
      - name: Apply compatible npm audit fixes
        run: npm audit fix
      - name: Verify dependency audit
        run: npm audit
      - name: Remove one-time workflow and commit updated lockfile
        run: |
          rm .github/workflows/dependency-audit-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/dependency-audit-fix-once.yml
          if git diff --cached --quiet; then
            echo "No dependency changes were needed."
            exit 0
          fi
          git commit -m "fix: update dependencies with compatible audit fixes"
          git push origin HEAD
