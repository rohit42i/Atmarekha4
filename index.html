<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Atma Rekha is an original Indian manga and mythical fantasy story inspired by Indian culture, mythology, traditions, spirituality, and original storytelling." />
  <meta name="application-name" content="Atma Rekha" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#080808" media="(prefers-color-scheme: dark)" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Atma Rekha" />
  <meta property="og:title" content="Atma Rekha — Original Indian Manga & Mythical Fantasy" />
  <meta property="og:description" content="An original Indian manga and mythical fantasy story inspired by Indian culture, mythology, traditions, spirituality, and original storytelling." />
  <meta property="og:url" content="https://www.atmarekha.in/" />
  <meta property="og:image" content="https://www.atmarekha.in/ishani.png" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Atma Rekha — Original Indian Manga & Mythical Fantasy" />
  <meta name="twitter:description" content="An original Indian manga and mythical fantasy story inspired by Indian culture, mythology, traditions, spirituality, and original storytelling." />
  <meta name="twitter:image" content="https://www.atmarekha.in/ishani.png" />
  <link rel="canonical" href="https://www.atmarekha.in/" />
  <link rel="icon" href="/ishani.png" type="image/png" />
  <link rel="stylesheet" href="/responsive-theme.css" />
  <script>
    (() => {
      const key = 'atma-rekha-theme';
      const stored = (() => { try { return localStorage.getItem(key); } catch { return null; } })();
      const theme = stored === 'light' || stored === 'dark'
        ? stored
        : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.arTheme = theme;
      document.documentElement.style.colorScheme = theme;
    })();
  </script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    .chapter-list-page .subpage-header .header-kicker { display: none !important; }
  </style>
  <title>Atma Rekha — Original Indian Manga & Mythical Fantasy</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/main.jsx"></script>
</body>
</html>
